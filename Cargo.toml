[package]
name = "px"
version = "0.2.1"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clipboard-win = "5.4"
winreg = "0.56"
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
zip = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
